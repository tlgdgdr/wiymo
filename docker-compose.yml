services:
  postgres:
    image: postgres:16-alpine
    container_name: socialworld-postgres
    environment:
      POSTGRES_DB: socialworld
      POSTGRES_USER: socialworld
      POSTGRES_PASSWORD: socialworld
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialworld"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
