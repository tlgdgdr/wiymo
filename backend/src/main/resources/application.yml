spring:
  application:
    name: socialworld
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/socialworld}
    username: ${DB_USERNAME:socialworld}
    password: ${DB_PASSWORD:socialworld}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    # MUST be overridden outside local development. Minimum 32 bytes.
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789abcdef}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:30d}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}
